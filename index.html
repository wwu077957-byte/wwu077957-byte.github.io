<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PC28 · 专业杀组看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            max-width: 520px;
            width: 100%;
            background: rgba(20, 20, 32, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 20px 16px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a2a;
        }
        .status-bar .live { color: #4cd964; font-weight: 600; }
        .status-bar .live::before { content: "●"; margin-right: 6px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .status-bar .time { color: #555; font-variant-numeric: tabular-nums; }
        .badge { background: #2a2a3e; padding: 4px 12px; border-radius: 20px; font-size: 11px; color: #aaa; font-weight: 500; }

        .header { text-align: center; padding: 4px 0 12px; }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(135deg, #f6b83d, #f5a623); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header .sub { font-size: 12px; color: #555; letter-spacing: 3px; margin-top: 2px; }

        .algo-switch {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
            background: #1a1a2a;
            border-radius: 30px;
            padding: 4px;
        }
        .algo-switch button {
            flex: 1;
            border: none;
            background: transparent;
            color: #888;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .algo-switch button.active {
            background: #f6b83d;
            color: #0a0a12;
        }
        .algo-switch button:active { opacity: 0.6; }

        .card { background: rgba(255,255,255,0.03); border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.04); backdrop-filter: blur(10px); }
        .card-latest .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-latest .period { font-size: 14px; color: #888; }
        .card-latest .combo-badge { background: rgba(74,217,100,0.15); color: #4cd964; padding: 2px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; }
        .card-latest .nums { font-size: 28px; font-weight: 600; color: #fff; letter-spacing: 2px; margin: 4px 0 2px; }
        .card-latest .nums .sep { color: #444; margin: 0 4px; }
        .card-latest .sum { font-size: 14px; color: #888; }

        .card-kill { background: linear-gradient(145deg, rgba(255,59,48,0.08), rgba(255,59,48,0.02)); border: 1px solid rgba(255,59,48,0.15); text-align: center; position: relative; overflow: hidden; }
        .card-kill::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at center, rgba(255,59,48,0.05), transparent 70%); animation: glow 4s ease-in-out infinite alternate; }
        @keyframes glow { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }
        .card-kill .label { font-size: 13px; color: #888; letter-spacing: 2px; position: relative; z-index: 1; }
        .card-kill .kill { font-size: 40px; font-weight: 800; color: #ff3b30; line-height: 1.2; margin-top: 4px; text-shadow: 0 0 40px rgba(255,59,48,0.25); position: relative; z-index: 1; letter-spacing: 2px; }
        .card-kill .sub-info { font-size: 12px; color: #666; margin-top: 4px; position: relative; z-index: 1; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .stat-item { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 10px 4px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .stat-item .num { font-size: 20px; font-weight: 700; color: #fff; }
        .stat-item .num.gold { color: #f6b83d; }
        .stat-item .num.green { color: #4cd964; }
        .stat-item .num.red { color: #ff3b30; }
        .stat-item .num.purple { color: #bf7aff; }
        .stat-item .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        .card-history .title { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 8px; }
        .history-dots { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; }
        .history-dots .dot { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); }
        .history-dots .dot.win { background: rgba(76,217,100,0.2); border-color: #4cd964; color: #4cd964; }
        .history-dots .dot.lose { background: rgba(255,59,48,0.2); border-color: #ff3b30; color: #ff3b30; }

        .reward-box { background: rgba(246,184,61,0.08); border: 1px solid rgba(246,184,61,0.15); border-radius: 14px; padding: 10px 16px; text-align: center; margin-bottom: 16px; }
        .reward-box .label { font-size: 12px; color: #888; }
        .reward-box .amount { font-size: 22px; font-weight: 700; color: #f6b83d; }

        .countdown-box { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border-radius: 14px; padding: 8px 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.04); }
        .countdown-box .label { font-size: 13px; color: #888; }
        .countdown-box .time { font-size: 18px; font-weight: 600; color: #4cd964; font-variant-numeric: tabular-nums; }

        .history-table-wrap { max-height: 250px; overflow-y: auto; margin-top: 12px; }
        .history-table-wrap::-webkit-scrollbar { width: 4px; }
        .history-table-wrap::-webkit-scrollbar-track { background: #1a1a2a; border-radius: 4px; }
        .history-table-wrap::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #666; font-weight: 500; padding: 6px 4px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #0a0a12; }
        td { padding: 6px 4px; border-bottom: 1px solid #1a1a2a; color: #ccc; }
        td .result-icon { font-size: 16px; }
        .refresh-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #aaa; padding: 6px 16px; border-radius: 30px; font-size: 13px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(10px); }
        .refresh-btn:active { background: rgba(255,255,255,0.12); color: #fff; }

        @media (max-width: 420px) {
            #app { padding: 16px 12px; }
            .card-kill .kill { font-size: 32px; }
            .stats-grid { gap: 4px; }
            .stat-item .num { font-size: 18px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="live">实时监控</span>
        <span class="badge" id="algoNameBadge">换球算法</span>
        <span class="time" id="updateTime">--:--:--</span>
    </div>

    <!-- 标题 -->
    <div class="header">
        <h1>🔥 PC28 杀组预测</h1>
        <div class="sub" id="algoSub">C球 · 跨期</div>
    </div>

    <!-- 算法切换 -->
    <div class="algo-switch" id="algoSwitch">
        <button class="active" data-algo="huanqiu">换球算法</button>
        <button data-algo="logc1">对数C算法</button>
    </div>

    <!-- 最新开奖 -->
    <div class="card card-latest">
        <div class="top">
            <span class="period">📡 期号 <span id="period">--</span></span>
            <span class="combo-badge" id="comboBadge">--</span>
        </div>
        <div class="nums">
            <span id="a">--</span><span class="sep">+</span>
            <span id="b">--</span><span class="sep">+</span>
            <span id="c">--</span>
        </div>
        <div class="sum">和值 <b id="sum">--</b></div>
    </div>

    <!-- 预测杀号 -->
    <div class="card card-kill">
        <div class="label">🔮 下一期预测</div>
        <div class="kill" id="kill">-- 杀 --</div>
        <div class="sub-info">基于 <span id="basedOn">--</span></div>
    </div>

    <!-- 统计 -->
    <div class="stats-grid">
        <div class="stat-item"><div class="num gold" id="total">0</div><div class="lbl">总期数</div></div>
        <div class="stat-item"><div class="num green" id="hit">0</div><div class="lbl">🀄️ 杀对</div></div>
        <div class="stat-item"><div class="num red" id="miss">0</div><div class="lbl">🍉 杀错</div></div>
        <div class="stat-item"><div class="num" id="rate">0%</div><div class="lbl">命中率</div></div>
        <div class="stat-item"><div class="num purple" id="curWin">0</div><div class="lbl">当前连对</div></div>
        <div class="stat-item"><div class="num" id="maxWin" style="color:#f6b83d;">0</div><div class="lbl">最高连对</div></div>
    </div>

    <!-- 连中奖励 -->
    <div class="reward-box" id="rewardBox">
        <div class="label">🏆 连中奖励</div>
        <div class="amount" id="rewardAmount">-</div>
    </div>

    <!-- 倒计时 -->
    <div class="countdown-box">
        <span class="label">⏳ 下期开奖</span>
        <span class="time" id="countdown">--:--</span>
    </div>

    <!-- 历史结果序列 -->
    <div class="card card-history">
        <div class="title">
            <span>📋 最近结果</span>
            <span class="counts">
                <span class="win">🀄️ <span id="winCount">0</span></span>
                <span style="margin:0 6px;color:#555;">|</span>
                <span class="lose">🍉 <span id="loseCount">0</span></span>
            </span>
        </div>
        <div class="history-dots" id="historyDots"></div>
    </div>

    <!-- 开奖流水历史记录 -->
    <div class="card" style="padding:12px 12px 8px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:14px; color:#888;">📜 开奖流水</span>
            <button class="refresh-btn" id="refreshBtn">⟳ 手动刷新</button>
        </div>
        <div class="history-table-wrap" id="historyTableWrap">
            <table>
                <thead><tr><th>期号</th><th>开奖</th><th>和值</th><th>类型</th><th>预测</th><th>结果</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ========== 配置 ==========
const API_URL = "https://pc28.help/api/kj.json?nbr=5";
const STORAGE_KEY = 'pc28_history_data';
const ALGO_NAMES = {
    huanqiu: '换球算法',
    logc1: '对数C算法'
};

// ========== N值表 ==========
const KILL_MAP = {
    0:"小双",1:"小单",2:"小双",3:"小单",4:"小双",5:"小单",
    6:"小双",7:"小单",8:"小双",9:"小单",10:"小双",11:"小单",
    12:"小双",13:"小单",14:"大双",15:"大单",16:"大双",17:"大单",
    18:"大双",19:"大单",20:"大双",21:"大单",22:"大双",23:"大单",
    24:"大双",25:"大单",26:"大双",27:"大单"
};

// ========== 算法函数 ==========
function getKill_huanqiu(c1, c2) {
    const val = (Math.sin(c1) * Math.sqrt(c2)) / 3.0;
    const absVal = Math.abs(val);
    const s = absVal.toFixed(10);
    const frac = s.split('.')[1];
    const digits = (frac + '000').slice(0, 3);
    const n = parseInt(digits[0]) + parseInt(digits[1]) + parseInt(digits[2]);
    return KILL_MAP[n] || "小双";
}

function getKill_logc1(c1) {
    if (c1 <= 0) return "小双";
    const val = Math.log10(c1) * 3.0;
    const absVal = Math.abs(val);
    const s = absVal.toFixed(10);
    const frac = s.split('.')[1];
    const digits = (frac + '000').slice(0, 3);
    const n = parseInt(digits[0]) + parseInt(digits[1]) + parseInt(digits[2]);
    return KILL_MAP[n] || "小双";
}

// ========== 奖励表 ==========
function getReward(winStreak) {
    if (winStreak >= 13) return '28.8 CNY';
    if (winStreak >= 11) return '15.8 CNY';
    if (winStreak >= 9) return '13.8 CNY';
    return '-';
}

// ========== 状态 ==========
let currentAlgo = 'huanqiu';
let history = [];          // 存储所有记录 { period, a,b,c, sum, combo, pred, result }
let pendingPeriod = null;
let pendingKill = null;
let pendingRec = null;     // 待验证的记录对象
let total = 0, hit = 0, miss = 0, curWin = 0, maxWin = 0;
let lastBroadcastPeriod = null;
let countdownTimer = null;

// ========== localStorage 操作 ==========
function loadHistory() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            history = JSON.parse(data);
            // 重建统计
            total = history.length;
            hit = history.filter(r => r.result === '🀄️').length;
            miss = total - hit;
            // 计算连对
            let max = 0, cur = 0;
            for (const r of history) {
                if (r.result === '🀄️') { cur++; max = Math.max(max, cur); }
                else { cur = 0; }
            }
            curWin = cur;
            maxWin = max;
        }
    } catch (e) { console.warn('加载历史失败', e); }
}

function saveHistory() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) { console.warn('保存历史失败', e); }
}

// ========== 数据获取 ==========
async function fetchData() {
    try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error('网络错误');
        const json = await resp.json();
        if (!json.data || json.data.length === 0) throw new Error('无数据');
        const items = json.data.map(item => {
            const nums = item.number.split('+').map(Number);
            const s = nums.reduce((a,b) => a+b, 0);
            const combo = (s >= 14 ? '大' : '小') + (s % 2 ? '单' : '双');
            return {
                period: String(item.nbr),
                a: nums[0], b: nums[1], c: nums[2],
                sum: s,
                combo: combo
            };
        });
        items.sort((a,b) => parseInt(a.period) - parseInt(b.period));
        const countdown = json.countdown || '00:30';
        return { data: items, countdown };
    } catch (e) {
        console.error(e);
        return null;
    }
}

// ========== 核心更新 ==========
async function refreshData() {
    const result = await fetchData();
    if (!result) return;
    const { data, countdown } = result;
    if (data.length < 2) return;

    // 更新倒计时
    updateCountdown(countdown);

    // 查找最新一期
    const latest = data[data.length - 1];
    const current = latest.period;

    // 检查是否已存在于历史
    const existing = history.find(r => r.period === current);
    if (!existing) {
        // 新期，先验证上一期预测
        if (pendingPeriod && pendingPeriod === current) {
            // 验证
            const ok = pendingKill !== latest.combo;
            const rec = {
                period: current,
                a: latest.a, b: latest.b, c: latest.c,
                sum: latest.sum,
                combo: latest.combo,
                pred: pendingKill,
                result: ok ? '🀄️' : '🍉'
            };
            history.push(rec);
            total++;
            if (ok) {
                hit++;
                curWin++;
                if (curWin > maxWin) maxWin = curWin;
            } else {
                miss++;
                curWin = 0;
            }
            saveHistory();
            pendingPeriod = null;
            pendingKill = null;
        } else {
            // 如果没有待验证，但新期出现，可能之前遗漏，直接记录历史(无预测)
            const rec = {
                period: current,
                a: latest.a, b: latest.b, c: latest.c,
                sum: latest.sum,
                combo: latest.combo,
                pred: '--',
                result: '--'
            };
            history.push(rec);
            saveHistory();
        }
    }

    // 生成新预测(用最新两期)
    if (data.length >= 3) {
        const prev = data[data.length - 2];
        const prev2 = data[data.length - 3];
        let kill, basedOn;
        if (currentAlgo === 'huanqiu') {
            const c1 = prev.c;
            const c2 = prev2.c;
            kill = getKill_huanqiu(c1, c2);
            basedOn = `C1=${c1}, C2=${c2}`;
        } else { // logc1
            const c1 = prev.c;
            kill = getKill_logc1(c1);
            basedOn = `C1=${c1}`;
        }
        const nextPeriod = String(parseInt(current) + 1);
        pendingPeriod = nextPeriod;
        pendingKill = kill;
        lastBroadcastPeriod = current;

        // 更新UI
        updateUI(latest, kill, basedOn, nextPeriod);
        // 更新历史表格
        renderHistoryTable();
    }
}

// ========== UI更新 ==========
function updateUI(latest, kill, basedOn, nextPeriod) {
    // 最新开奖
    document.getElementById('period').textContent = latest.period;
    document.getElementById('a').textContent = latest.a;
    document.getElementById('b').textContent = latest.b;
    document.getElementById('c').textContent = latest.c;
    document.getElementById('sum').textContent = latest.sum;
    document.getElementById('comboBadge').textContent = latest.combo;

    // 预测
    if (kill) {
        const shortPeriod = nextPeriod.slice(-2);
        document.getElementById('kill').textContent = `${shortPeriod} 杀 ${kill}`;
    } else {
        document.getElementById('kill').textContent = '-- 杀 --';
    }
    document.getElementById('basedOn').textContent = basedOn || '--';

    // 统计
    const rate = total ? (hit / total * 100) : 0;
    document.getElementById('total').textContent = total;
    document.getElementById('hit').textContent = hit;
    document.getElementById('miss').textContent = miss;
    document.getElementById('rate').textContent = rate.toFixed(1) + '%';
    document.getElementById('curWin').textContent = curWin;
    document.getElementById('maxWin').textContent = maxWin;

    // 奖励
    document.getElementById('rewardAmount').textContent = getReward(curWin);

    // 历史点阵
    const recent = history.slice(-15).map(r => r.result).filter(r => r !== '--');
    const dotsContainer = document.getElementById('historyDots');
    dotsContainer.innerHTML = recent.map(r => {
        const cls = r === '🀄️' ? 'win' : 'lose';
        return `<div class="dot ${cls}">${r}</div>`;
    }).join('');
    if (recent.length === 0) dotsContainer.innerHTML = '<span style="color:#555;font-size:13px;">暂无结果</span>';

    const winCnt = history.filter(r => r.result === '🀄️').length;
    const loseCnt = history.filter(r => r.result === '🍉').length;
    document.getElementById('winCount').textContent = winCnt;
    document.getElementById('loseCount').textContent = loseCnt;

    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();

    // 更新算法名称
    document.getElementById('algoNameBadge').textContent = ALGO_NAMES[currentAlgo];
    document.getElementById('algoSub').textContent = currentAlgo === 'huanqiu' ? 'C球 · 跨期' : 'C球 · 对数';
}

function renderHistoryTable() {
    const tbody = document.getElementById('historyBody');
    // 显示最近30条(倒序)
    const items = history.slice(-30).reverse();
    tbody.innerHTML = items.map(r => `
        <tr>
            <td>${r.period}</td>
            <td>${r.a}+${r.b}+${r.c}</td>
            <td>${r.sum}</td>
            <td>${r.combo}</td>
            <td>${r.pred || '--'}</td>
            <td class="result-icon">${r.result || '--'}</td>
        </tr>
    `).join('');
}

// ========== 倒计时更新 ==========
function updateCountdown(countdownStr) {
    const el = document.getElementById('countdown');
    if (countdownStr && countdownStr.includes(':')) {
        el.textContent = countdownStr;
    } else {
        // 模拟倒计时：每3分钟一期，简单显示
        if (!window._countdownSeconds) {
            window._countdownSeconds = 180;
        }
        const mins = Math.floor(window._countdownSeconds / 60);
        const secs = window._countdownSeconds % 60;
        el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        if (window._countdownSeconds > 0) window._countdownSeconds--;
        else window._countdownSeconds = 180;
    }
}

// ========== 算法切换 ==========
function switchAlgo(algo) {
    if (algo === currentAlgo) return;
    currentAlgo = algo;
    document.querySelectorAll('.algo-switch button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.algo === algo);
    });
    // 清空待验证，重新预测
    pendingPeriod = null;
    pendingKill = null;
    refreshData();
}

// ========== 初始化 ==========
function init() {
    loadHistory();
    // 注册算法切换
    document.querySelectorAll('.algo-switch button').forEach(btn => {
        btn.addEventListener('click', () => switchAlgo(btn.dataset.algo));
    });
    // 手动刷新
    document.getElementById('refreshBtn').addEventListener('click', refreshData);

    // 首次刷新
    refreshData();
    // 自动刷新每3秒
    setInterval(refreshData, 3000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
