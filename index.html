<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>多情 · 加拿大28 高级版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'SF Pro Display', 'Helvetica Neue', sans-serif; }
        :root {
            --bg: #F2F4F8; --surface: rgba(255,255,255,0.65); --surface-heavy: rgba(255,255,255,0.85);
            --text: #0F0F11; --text-secondary: #6B7280; --border: rgba(0,0,0,0.06);
            --shadow: 0 12px 40px rgba(0,0,0,0.06); --glass: rgba(255,255,255,0.75);
            --accent-rose: #FF2D55; --accent-indigo: #5856D6; --accent-orange: #FF9500;
            --accent-teal: #00C7BE; --accent-green: #34C759; --radius: 32px; --radius-xl: 40px;
            transition: background 0.3s, color 0.3s;
        }
        body.dark {
            --bg: #0F0F11; --surface: rgba(28,28,30,0.65); --surface-heavy: rgba(28,28,30,0.85);
            --text: #F5F5F7; --text-secondary: #8E8E93; --border: rgba(255,255,255,0.06);
            --shadow: 0 12px 40px rgba(0,0,0,0.4); --glass: rgba(44,44,46,0.75);
        }
        body { background: var(--bg); color: var(--text); min-height:100vh; display:flex; flex-direction:column; padding: env(safe-area-inset-top) 20px calc(20px + env(safe-area-inset-bottom)); transition: background 0.3s, color 0.3s; position:relative; }
        .ambient-bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .ambient-blob { position:absolute; border-radius:50%; filter:blur(100px); opacity:0.25; animation:blobDrift 25s infinite alternate ease-in-out; }
        body.dark .ambient-blob { opacity:0.15; }
        .ambient-blob:nth-child(1) { width:350px; height:350px; background:radial-gradient(circle,rgba(88,86,214,0.2),transparent 70%); top:-5%; left:-15%; animation-delay:0s; }
        .ambient-blob:nth-child(2) { width:280px; height:280px; background:radial-gradient(circle,rgba(0,199,190,0.15),transparent 70%); bottom:15%; right:-10%; animation-delay:-8s; }
        .ambient-blob:nth-child(3) { width:220px; height:220px; background:radial-gradient(circle,rgba(255,149,0,0.12),transparent 70%); top:45%; left:60%; animation-delay:-16s; }
        @keyframes blobDrift { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(40px,-40px) scale(1.15);} }
        .noise-overlay { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.025; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E"); background-repeat:repeat; background-size:256px; }
        .status-island { position:relative; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:14px 0 18px; flex-wrap:wrap; gap:8px; }
        .island-pill { background:var(--surface); backdrop-filter:blur(24px) saturate(150%); border:1px solid var(--glass); box-shadow:0 4px 24px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.9); border-radius:100px; padding:8px 20px; display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; color:var(--text-secondary); letter-spacing:0.5px; }
        .island-dot { width:7px; height:7px; border-radius:50%; background:var(--accent-green); box-shadow:0 0 10px rgba(52,199,89,0.6); position:relative; }
        .island-dot::after { content:''; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--accent-green); opacity:0; animation:pulseRing 2.5s infinite cubic-bezier(0.4,0,0.6,1); }
        @keyframes pulseRing { 0%{transform:scale(0.7); opacity:0.5;} 100%{transform:scale(1.8); opacity:0;} }
        .theme-toggle { background:var(--surface); backdrop-filter:blur(24px); border:1px solid var(--glass); border-radius:100px; padding:8px 16px; font-size:18px; cursor:pointer; color:var(--text); transition:all 0.3s; }
        .theme-toggle:active { transform:scale(0.9); }
        .history-trigger-top { background:var(--surface); backdrop-filter:blur(24px); border:1px solid var(--glass); border-radius:100px; padding:8px 18px; font-size:13px; font-weight:800; cursor:pointer; color:var(--text-secondary); transition:all 0.3s; display:flex; align-items:center; gap:6px; }
        .history-trigger-top:active { transform:scale(0.92); }
        .refresh-area { display:flex; align-items:center; gap:8px; }
        .refresh-btn { background:var(--surface); backdrop-filter:blur(24px); border:1px solid var(--glass); border-radius:100px; padding:8px 16px; font-size:13px; font-weight:800; cursor:pointer; color:var(--text-secondary); transition:all 0.3s; display:flex; align-items:center; gap:6px; }
        .refresh-btn:active { transform:scale(0.92); }
        .refresh-time { font-size:10px; color:var(--text-secondary); opacity:0.7; }
        .brand { text-align:center; padding:10px 0 24px; position:relative; z-index:10; }
        .brand-name { font-size:26px; font-weight:900; letter-spacing:1px; background:linear-gradient(135deg, #0F0F11 0%, #3A3A3C 40%, #0F0F11 60%, #636366 100%); background-size:300% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:metalShine 6s infinite linear; display:inline-block; }
        body.dark .brand-name { background:linear-gradient(135deg, #F5F5F7 0%, #AEAEB2 40%, #F5F5F7 60%, #8E8E93 100%); }
        @keyframes metalShine { 0%{background-position:300% 0;} 100%{background-position:-300% 0;} }
        .brand-sub { font-size:10px; color:var(--text-secondary); opacity:0.7; margin-top:8px; font-weight:700; letter-spacing:4px; text-transform:uppercase; }
        .brand-badge { display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:linear-gradient(135deg, rgba(255,45,85,0.06), rgba(255,149,0,0.04)); border:1px solid rgba(255,45,85,0.1); color:var(--accent-rose); padding:5px 14px; border-radius:100px; font-size:10px; font-weight:800; backdrop-filter:blur(10px); letter-spacing:0.5px; }
        .algo-switch { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; z-index:10; position:relative; }
        .algo-btn { background:var(--surface); backdrop-filter:blur(16px); border:1px solid var(--glass); border-radius:30px; padding:8px 16px; font-size:12px; font-weight:800; color:var(--text-secondary); cursor:pointer; transition:all 0.3s; box-shadow:var(--shadow); }
        .algo-btn.active { background:var(--accent-indigo); color:white; border-color:var(--accent-indigo); box-shadow:0 4px 16px rgba(88,86,214,0.3); }
        .algo-btn:active { transform:scale(0.92); }
        .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:30vh; padding:10px 0; position:relative; z-index:10; width:100%; }
        .stage-header { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
        .stage-label { font-size:10px; font-weight:800; color:var(--text-secondary); letter-spacing:3px; text-transform:uppercase; }
        .stage-live { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800; color:var(--accent-rose); background:rgba(255,45,85,0.06); padding:4px 12px; border-radius:100px; letter-spacing:1px; }
        .live-dot { width:5px; height:5px; border-radius:50%; background:var(--accent-rose); animation:liveBlink 2s infinite; }
        @keyframes liveBlink { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.3; transform:scale(0.8);} }
        .draw-orb-group { display:flex; gap:22px; margin-bottom:28px; position:relative; }
        .draw-orb { width:90px; height:90px; border-radius:50%; position:relative; background:radial-gradient(circle at 32% 32%, #FFFFFF 0%, #F5F5F7 40%, #E8E8ED 100%); display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:900; color:var(--text); letter-spacing:-1px; box-shadow:0 24px 48px rgba(0,0,0,0.12), 0 8px 20px rgba(0,0,0,0.08), inset 0 -8px 16px rgba(0,0,0,0.04), inset 0 8px 16px rgba(255,255,255,0.95), inset 0 0 0 1px rgba(255,255,255,0.9); border:none; animation:orbFloat 6s ease-in-out infinite; transform-style:preserve-3d; transition:transform 0.3s; }
        body.dark .draw-orb { background:radial-gradient(circle at 32% 32%, #3A3A3C 0%, #1C1C1E 60%, #0F0F11 100%); color:#F5F5F7; box-shadow:0 24px 48px rgba(0,0,0,0.4), inset 0 -8px 16px rgba(0,0,0,0.2), inset 0 8px 16px rgba(255,255,255,0.05); }
        .draw-orb::before { content:''; position:absolute; top:10%; left:16%; width:30%; height:22%; background:radial-gradient(ellipse, rgba(255,255,255,0.98), transparent 60%); border-radius:50%; filter:blur(1px); pointer-events:none; }
        body.dark .draw-orb::before { background:radial-gradient(ellipse, rgba(255,255,255,0.1), transparent 60%); }
        .draw-orb::after { content:''; position:absolute; bottom:6%; left:22%; width:56%; height:18%; background:radial-gradient(ellipse, rgba(0,0,0,0.05), transparent 70%); border-radius:50%; filter:blur(3px); pointer-events:none; }
        .draw-orb:nth-child(2) { animation-delay:-2s; }
        .draw-orb:nth-child(3) { animation-delay:-4s; }
        @keyframes orbFloat { 0%,100%{transform:translateY(0) rotateX(0) rotateY(0);} 50%{transform:translateY(-12px) rotateX(3deg) rotateY(2deg);} }
        .draw-orb.pop { animation:orbPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes orbPop { 0%{transform:scale(0.8);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
        .draw-meta { font-size:14px; color:var(--text-secondary); font-weight:700; text-align:center; letter-spacing:-0.2px; background:var(--surface); backdrop-filter:blur(16px); padding:12px 24px; border-radius:100px; border:1px solid var(--glass); box-shadow:var(--shadow); }
        .draw-meta span { color:var(--text); font-weight:900; margin:0 3px; }
        .satellites { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-top:32px; width:100%; max-width:400px; position:relative; z-index:10; }
        .satellite { aspect-ratio:1; border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; position:relative; overflow:hidden; background:var(--surface); backdrop-filter:blur(50px) saturate(200%); border:1px solid var(--glass); box-shadow:var(--shadow); transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .satellite::before { content:''; position:absolute; top:0; left:0; right:0; height:45%; background:linear-gradient(180deg, rgba(255,255,255,0.3), transparent); pointer-events:none; z-index:1; }
        body.dark .satellite::before { background:linear-gradient(180deg, rgba(255,255,255,0.05), transparent); }
        .satellite:active { transform:scale(0.94) translateY(1px); }
        .sat-rose .sat-value { color:var(--accent-rose); text-shadow:0 2px 8px rgba(255,45,85,0.15); }
        .sat-indigo .sat-value { color:var(--accent-indigo); text-shadow:0 2px 8px rgba(88,86,214,0.15); }
        .sat-orange .sat-value { color:var(--accent-orange); text-shadow:0 2px 8px rgba(255,149,0,0.15); }
        .sat-value { font-size:clamp(14px, 3.8vw, 18px); font-weight:900; text-align:center; white-space:nowrap; letter-spacing:-0.5px; position:relative; z-index:2; }
        .sat-label { font-size:10px; font-weight:800; color:var(--text-secondary); margin-top:10px; letter-spacing:1px; text-transform:uppercase; position:relative; z-index:2; }
        .dock { background:var(--surface-heavy); backdrop-filter:blur(60px) saturate(220%); border-radius:var(--radius-xl); padding:28px 24px; margin-top:auto; box-shadow:var(--shadow-lg), 0 0 0 1px var(--glass); border:1px solid var(--glass); width:100%; max-width:500px; margin-left:auto; margin-right:auto; position:relative; z-index:10; }
        .dock::before { content:''; position:absolute; top:0; left:30%; right:30%; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); }
        .dock-section { margin-bottom:24px; }
        .dock-section:last-child { margin-bottom:0; }
        .dock-section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; }
        .dock-section-title { font-size:10px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:2px; }
        .dock-countdown-wrap { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
        .dock-countdown { font-size:48px; font-weight:900; color:var(--accent-teal); font-variant-numeric:tabular-nums; letter-spacing:-3px; line-height:1; text-shadow:0 2px 12px rgba(0,199,190,0.15); }
        .dock-next-time { font-size:14px; color:var(--text-secondary); font-weight:700; margin-left:auto; }
        .dock-divider { height:1px; background:linear-gradient(90deg, transparent, var(--border), transparent); margin:20px 0; }
        .scheme-strip { display:flex; gap:14px; align-items:center; }
        .scheme-text { flex:1; background:rgba(0,0,0,0.02); border-radius:24px; padding:18px 22px; font-size:15px; font-weight:800; border:1px solid var(--border); outline:none; color:var(--text); box-shadow:inset 0 1px 3px rgba(0,0,0,0.02); }
        .scheme-btn { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg, #0F0F11, #1C1C1E); color:white; border:none; font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.4s cubic-bezier(0.4,0,0.2,1); box-shadow:0 8px 24px rgba(0,0,0,0.2); flex-shrink:0; position:relative; overflow:hidden; }
        .scheme-btn::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), transparent 60%); pointer-events:none; }
        .scheme-btn:active { transform:scale(0.82); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        .dock-pills { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
        .dock-pill { padding:10px 18px; border-radius:20px; background:var(--surface); font-size:14px; font-weight:800; color:var(--accent-indigo); border:1px solid var(--border); transition:all 0.3s; backdrop-filter:blur(10px); }
        .history-trigger-bottom { text-align:center; padding:28px 16px 24px; font-size:13px; font-weight:800; color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; transition:all 0.3s; position:relative; z-index:10; display:flex; align-items:center; justify-content:center; gap:8px; }
        .history-trigger-bottom:active { opacity:0.5; transform:scale(0.97); }
        .history-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.15); backdrop-filter:blur(12px); z-index:99; opacity:0; pointer-events:none; transition:opacity 0.5s ease; }
        .history-modal-overlay.open { opacity:1; pointer-events:auto; }
        .history-panel { position:fixed; bottom:0; left:0; right:0; top:6%; background:var(--surface-heavy); backdrop-filter:blur(80px) saturate(240%); border-radius:var(--radius-xl) var(--radius-xl) 0 0; padding:32px 24px calc(32px + env(safe-area-inset-bottom)); box-shadow:0 -24px 80px rgba(0,0,0,0.12); transform:translateY(110%); transition:transform 0.6s cubic-bezier(0.32,0.72,0,1); overflow-y:auto; z-index:100; border-top:1px solid var(--glass); display:flex; flex-direction:column; }
        .history-panel.open { transform:translateY(0); }
        .history-panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-shrink:0; }
        .history-panel-title { font-size:26px; font-weight:900; letter-spacing:-0.5px; }
        .history-panel-close { width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,0.04); border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; color:var(--text); }
        .history-panel-close:active { background:rgba(0,0,0,0.1); transform:scale(0.88); }
        .history-table-wrap { flex:1; overflow-y:auto; border-radius:24px; background:var(--surface); border:1px solid var(--border); }
        .history-table { width:100%; border-collapse:separate; border-spacing:0; font-size:12px; }
        .history-table th { padding:16px 8px; background:rgba(0,0,0,0.02); font-weight:800; color:var(--text-secondary); border-bottom:1px solid var(--border); position:sticky; top:0; backdrop-filter:blur(10px); z-index:2; letter-spacing:0.5px; }
        .history-table td { padding:14px 8px; text-align:center; border-bottom:1px solid var(--border); font-weight:700; }
        .badge-green { color:var(--accent-green); background:rgba(52,199,89,0.08); padding:4px 12px; border-radius:12px; font-size:11px; display:inline-block; border:1px solid rgba(52,199,89,0.12); }
        .badge-red { color:var(--accent-rose); background:rgba(255,45,85,0.08); padding:4px 12px; border-radius:12px; font-size:11px; display:inline-block; border:1px solid rgba(255,45,85,0.12); }
        .splash-screen { position:fixed; top:0; left:0; width:100%; height:100vh; background:var(--bg); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.7s cubic-bezier(0.4,0,0.2,1); cursor:pointer; }

        .splash-name { font-size:32px; font-weight:900; margin-bottom:8px; letter-spacing:-0.5px; }
        .splash-sub { color:var(--text-secondary); font-size:13px; font-weight:700; margin-bottom:48px; letter-spacing:4px; text-transform:uppercase; }
        .splash-info { background:var(--surface); border-radius:28px; padding:24px 36px; margin-bottom:48px; text-align:center; backdrop-filter:blur(24px); border:1px solid var(--glass); box-shadow:var(--shadow); }
        .splash-info p { color:var(--text-secondary); font-size:12px; line-height:1.9; font-weight:700; }
        .splash-info strong { color:var(--text); font-weight:900; }
        .splash-info .contact { color:var(--accent-indigo); font-weight:900; }
        .splash-progress-wrap { width:240px; text-align:center; }
        .splash-progress-bg { width:100%; height:5px; background:#E5E5EA; border-radius:3px; overflow:hidden; margin-bottom:14px; }
        body.dark .splash-progress-bg { background:#2C2C2E; }
        .splash-progress-fill { height:5px; background:linear-gradient(90deg, #0F0F11, #3A3A3C); border-radius:3px; transition:width 0.08s linear; width:0%; }
        .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-120px); background:linear-gradient(135deg, rgba(15,15,17,0.92), rgba(28,28,30,0.92)); backdrop-filter:blur(24px); color:white; padding:14px 28px; border-radius:100px; font-size:13px; font-weight:800; z-index:10000; opacity:0; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); box-shadow:0 12px 40px rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); pointer-events:none; display:flex; align-items:center; gap:10px; letter-spacing:0.3px; }

        .fade-in-up { animation:fadeInUp 0.8s cubic-bezier(0.4,0,0.2,1) forwards; opacity:0; transform:translateY(20px); }
        @keyframes fadeInUp { to { opacity:1; transform:translateY(0); } }
        .delay-1 { animation-delay:0.1s; }
        .delay-2 { animation-delay:0.2s; }
        .delay-3 { animation-delay:0.3s; }
        .delay-4 { animation-delay:0.4s; }
    </style>
</head>

    <div class="brand fade-in-up delay-2">
        <div class="brand-name">多情 · 加拿大28</div>
        <div class="brand-sub">换球算法 · 实时预测</div>
        <div class="brand-badge">内部算法 · 请勿外传</div>
    </div>

    <div class="algo-switch fade-in-up delay-2" id="algoSwitch">
        <button class="algo-btn active" data-algo="huanqiu">换球</button>
        <button class="algo-btn" data-algo="logc1">log10(c1)*3</button>
        <button class="algo-btn" data-algo="sqrtc3">√(c3)*20</button>
        <button class="algo-btn" data-algo="sinhtail">sinh(tail2)/7</button>
        <button class="algo-btn" data-algo="u1">U1混沌</button>
    </div>

    <div class="stage fade-in-up delay-3">
        <div class="stage-header">
            <div class="stage-label">最新开奖</div>
            <div class="stage-live"><div class="live-dot"></div>LIVE</div>
        </div>
        <div class="draw-orb-group">
            <div class="draw-orb" id="ball1">-</div>
            <div class="draw-orb" id="ball2">-</div>
            <div class="draw-orb" id="ball3">-</div>
        </div>
        <div class="draw-meta">
            第<span id="latestPeriod">----</span>期 · 和值<span id="latestSum">--</span> · <span id="latestType">--</span>
        </div>
        <div class="satellites fade-in-up delay-4">
            <div class="satellite sat-rose"><div class="sat-value" id="killText">--</div><div class="sat-label">杀组</div></div>
            <div class="satellite sat-indigo"><div class="sat-value" id="dualText">--</div><div class="sat-label">双组</div></div>
            <div class="satellite sat-orange"><div class="sat-value" id="betText">--</div><div class="sat-label">推荐</div></div>
        </div>
    </div>

    <div class="dock fade-in-up delay-4">
        <div class="dock-section">
            <div class="dock-section-header">
                <div class="dock-section-title">下期倒计时</div>
                <div class="dock-next-time" id="nextTimeDisplay">--:--:--</div>
            </div>
            <div class="dock-countdown-wrap">
                <div class="dock-countdown" id="countdownText">--:--</div>
                <div class="dock-countdown-label">下一期</div>
            </div>
        </div>
        <div class="dock-divider"></div>
        <div class="dock-section">
            <div class="dock-section-header">
                <div class="dock-section-title">预测方案</div>
            </div>
            <div class="scheme-strip">
                <input type="text" class="scheme-text" id="recordText" readonly value="等待数据加载...">
                <button class="scheme-btn" id="copyBtn">📋</button>
            </div>
            <div class="dock-pills" id="specialCodesContainer"></div>
        </div>
    </div>

    <div class="history-trigger-bottom fade-in-up delay-4" id="historyTriggerBottom">
        查看验证记录
        <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    </div>

    <div class="history-modal-overlay" id="historyOverlay"></div>
    <div class="history-panel" id="historyPanel">
        <div class="history-panel-header">
            <div class="history-panel-title">验证记录</div>
            <button class="history-panel-close" id="historyClose">✕</button>
        </div>
        <div class="history-table-wrap">
            <table class="history-table">
                <thead><tr><th>期号</th><th>开奖</th><th>算法</th><th>杀组</th><th>双组</th><th>结果</th></tr></thead>
                <tbody id="historyBody"><tr><td colspan="6">暂无记录</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        // ========== 配置 ==========
        const API_URL = "https://pc28.help/api/kj.json?nbr=30";
        const STORAGE_KEY = 'duoqing_advanced_v4';
        const DRAW_PERIOD = 210;

        // ========== N值表 ==========
        const KILL_MAP = {
            0:"小双",1:"小单",2:"小双",3:"小单",4:"小双",5:"小单",
            6:"小双",7:"小单",8:"小双",9:"小单",10:"小双",11:"小单",
            12:"小双",13:"小单",14:"大双",15:"大单",16:"大双",17:"大单",
            18:"大双",19:"大单",20:"大双",21:"大单",22:"大双",23:"大单",
            24:"大双",25:"大单",26:"大双",27:"大单"
        };
        const DUAL_MAP = {"小双":"大单","大单":"小双","小单":"大双","大双":"小单"};

        function toKill(val) {
            const absVal = Math.abs(val);
            const s = absVal.toFixed(10);
            const frac = s.split('.')[1];
            const digits = (frac + '000').slice(0, 3);
            const n = parseInt(digits[0]) + parseInt(digits[1]) + parseInt(digits[2]);
            return KILL_MAP[n] || "小双";
        }

        // ========== 五个算法(特征索引完全对齐Python) ==========
        // 期数定义：history[0]=最新期, history[1]=上期, history[2]=上上期, history[3]=上上上期
        function algo_huanqiu(rec) {
            const c1 = rec.c1 || 0, c2 = rec.c2 || 0;
            const val = (Math.sin(c1) * Math.sqrt(c2)) / 3.0;
            return toKill(val);
        }
        function algo_logc1(rec) {
            const c1 = rec.c1 || 0;
            if (c1 <= 0) return "小双";
            const val = Math.log10(c1) * 3.0;
            return toKill(val);
        }
        function algo_sqrtc3(rec) {
            const c3 = rec.c3 || 0;
            const val = Math.sqrt(c3) * 20.0;
            return toKill(val);
        }
        function algo_sinhtail(rec) {
            const tail2 = rec.tail2 || 0;
            const val = Math.sinh(tail2) / 7.0;
            return toKill(val);
        }
        function algo_u1(rec) {
            const S1 = rec.S1 || 0, A1 = rec.A1 || 0, S2 = rec.S2 || 0, C3 = rec.C3 || 0;
            const val = Math.sin(S1 * Math.PI) * Math.exp(Math.abs(A1 - C3) / (S2 + 1.1)) * 1.618;
            return toKill(val);
        }

        const ALGO_MAP = {
            huanqiu: { name: '换球', func: algo_huanqiu },
            logc1: { name: 'log10(c1)*3', func: algo_logc1 },
            sqrtc3: { name: '√(c3)*20', func: algo_sqrtc3 },
            sinhtail: { name: 'sinh(tail2)/7', func: algo_sinhtail },
            u1: { name: 'U1混沌', func: algo_u1 }
        };

        // ========== 全局状态 ==========
        let currentAlgo = 'huanqiu';
        let history = [];
        let latestDrawTime = null;
        let isRequesting = false;
        let countdownTimer = null;
        let autoRefreshTimer = null;

        // ========== 存储 ==========
        function loadRecords() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
        }
        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
        function addRecord(expect, algoName, kill, dual) {
            let records = loadRecords();
            if (records.some(r => r.expect === expect && r.algo === algoName)) return;
            records.push({ expect, algo: algoName, kill, dual, status: 'pending' });
            if (records.length > 50) records.shift();
            saveRecords(records);
        }
        function verifyRecord(expect, actualType) {
            let records = loadRecords();
            let updated = false;
            records = records.map(r => {
                if (r.expect === expect && r.status === 'pending') {
                    const killOk = (r.kill !== actualType);
                    const dualOk = (r.dual.includes(actualType));
                    updated = true;
                    return { ...r, status: 'verified', actualType, killOk, dualOk };
                }
                return r;
            });
            if (updated) saveRecords(records);
        }

        // ========== 数据获取 ==========
        async function fetchData() {
            try {
                const resp = await fetch(API_URL);
                if (!resp.ok) throw new Error('网络错误');
                const json = await resp.json();
                if (!json.data || json.data.length === 0) throw new Error('无数据');
                const items = json.data.map(item => {
                    const nums = item.number.split('+').map(Number);
                    const sum = nums.reduce((a,b) => a+b, 0);
                    const combo = (sum >= 14 ? '大' : '小') + (sum % 2 === 0 ? '双' : '单');
                    let opentime = Date.now();
                    if (item.date && item.time) {
                        try {
                            const dt = new Date(item.date + ' ' + item.time);
                            if (!isNaN(dt)) opentime = dt.getTime();
                        } catch(e) {}
                    }
                    return {
                        expect: String(item.nbr),
                        nums: nums,
                        sum: sum,
                        type: combo,
                        opentime: opentime
                    };
                });
                items.sort((a,b) => parseInt(b.expect) - parseInt(a.expect));
                return items;
            } catch(e) {
                console.error(e);
                return null;
            }
        }

        // ========== 计算预测(修正索引) ==========
        function computePrediction(history, algoKey) {
            if (history.length < 3) return { kill: '--', dual: ['--','--'] };
            // 最新期: history[0], 上期: history[1], 上上期: history[2], 上上上期: history[3]
            const rec = {
                c1: history[1]?.nums[2] || 0,       // 上期C
                c2: history[2]?.nums[2] || 0,       // 上上期C
                c3: history[2]?.nums[2] || 0,       // 上上期C(sqrtc3用)
                tail2: parseInt(history[2]?.expect?.slice(-1)) || 0, // 上上期尾数
                S1: history[0]?.sum || 0,           // 最新期和值
                A1: history[0]?.nums[0] || 0,       // 最新期A
                S2: history[1]?.sum || 0,           // 上期和值
                C3: history[3]?.nums[2] || 0,       // 上上上期C(U1需要)
            };
            const algo = ALGO_MAP[algoKey];
            if (!algo) return { kill: '--', dual: ['--','--'] };
            const kill = algo.func(rec);
            const dual = [kill, DUAL_MAP[kill] || '--'];
            return { kill, dual };
        }

        // ========== UI 渲染 ==========
        function renderUI(latest) {
            if (!latest) return;
            document.getElementById('ball1').textContent = latest.nums[0];
            document.getElementById('ball2').textContent = latest.nums[1];
            document.getElementById('ball3').textContent = latest.nums[2];
            document.getElementById('latestPeriod').textContent = latest.expect;
            document.getElementById('latestSum').textContent = latest.sum;
            document.getElementById('latestType').textContent = latest.type;
            latestDrawTime = new Date(latest.opentime);

            const pred = computePrediction(history, currentAlgo);
            const kill = pred.kill;
            const dual = pred.dual;
            document.getElementById('killText').textContent = kill;
            document.getElementById('dualText').textContent = dual.join('/');
            document.getElementById('betText').textContent = dual.join('/');

            const algoName = ALGO_MAP[currentAlgo].name;
            const nextExpect = String(parseInt(latest.expect) + 1);
            addRecord(nextExpect, algoName, kill, dual);

            document.getElementById('recordText').value = `杀${kill}🉐${dual.join('')} 13/14`;
            const specials = dual.map(t => {
                const map = { '小双':[2,4,6], '小单':[1,3,5], '大双':[14,16,18], '大单':[15,17,19] };
                return (map[t] || []).slice(0,2).map(n=>String(n).padStart(2,'0')).join(',');
            }).join(' ');
            document.getElementById('specialCodesContainer').innerHTML = specials ? `<div class="dock-pill">${specials}</div>` : '';

            renderHistory();
            startCountdown();
            updateNextTime();
            updateRefreshTime();
        }

        function renderHistory() {
            const records = loadRecords().reverse();
            const tbody = document.getElementById('historyBody');
            if (!records.length) {
                tbody.innerHTML = '<tr><td colspan="6">暂无记录</td></tr>';
                return;
            }
            tbody.innerHTML = records.slice(0,30).map(r => {
                const status = r.status === 'pending' ? '⏳' : (r.killOk ? '🀄️' : '🍉');
                const actual = r.status === 'verified' ? r.actualType : '--';
                return `<tr><td>${r.expect}</td><td>${actual}</td><td>${r.algo}</td><td>${r.kill}</td><td>${r.dual.join('/')}</td><td class="${r.status==='verified'?(r.killOk?'badge-green':'badge-red'):''}">${status}</td></tr>`;
            }).join('');
        }

        function updateNextTime() {
            if (latestDrawTime) {
                const nextTime = new Date(latestDrawTime.getTime() + DRAW_PERIOD * 1000);
                document.getElementById('nextTimeDisplay').textContent = nextTime.toLocaleTimeString();
            } else {
                document.getElementById('nextTimeDisplay').textContent = '--:--:--';
            }
        }

        function updateRefreshTime() {
            const now = new Date();
            document.getElementById('lastRefreshTime').textContent = now.toLocaleTimeString();
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            if (!latestDrawTime) {
                document.getElementById('countdownText').textContent = '--:--';
                return;
            }
            const tick = () => {
                const now = Date.now();
                const next = latestDrawTime.getTime() + DRAW_PERIOD * 1000;
                const diff = Math.max(0, Math.floor((next - now) / 1000));
                document.getElementById('countdownText').textContent =
                    `${String(Math.floor(diff/60)).padStart(2,'0')}:${String(diff%60).padStart(2,'0')}`;
                if (diff <= 0) {
                    clearInterval(countdownTimer);
                    fetchDataFastest();
                }
            };
            tick();
            countdownTimer = setInterval(tick, 200);
        }

        // ========== 核心更新 ==========
        async function fetchDataFastest() {
            if (isRequesting) return;
            isRequesting = true;
            const data = await fetchData();
            if (data && data.length > 0) {
                const existing = new Set(history.map(h => h.expect));
                for (const d of data) {
                    if (!existing.has(d.expect)) {
                        history.push(d);
                        existing.add(d.expect);
                    }
                }
                history.sort((a,b) => parseInt(b.expect) - parseInt(a.expect));
                const latest = history[0];
                verifyRecord(latest.expect, latest.type);
                renderUI(latest);
            }
            isRequesting = false;
        }

        function refreshData() {
            fetchDataFastest();
        }

        // ========== 切换算法 ==========
        function switchAlgo(algoKey) {
            if (algoKey === currentAlgo) return;
            currentAlgo = algoKey;
            document.querySelectorAll('.algo-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.algo === algoKey);
            });
            if (history.length) {
                const latest = history[0];
                renderUI(latest);
            }
        }

        // ========== 主题切换 ==========
        function toggleTheme() {
            document.body.classList.toggle('dark');
            document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? '🌙' : '☀️';
        }

        // ========== 历史面板控制 ==========
        function openHistory() {
            document.getElementById('historyOverlay').classList.add('open');
            document.getElementById('historyPanel').classList.add('open');
        }
        function closeHistory() {
            document.getElementById('historyPanel').classList.remove('open');
            setTimeout(() => document.getElementById('historyOverlay').classList.remove('open'), 100);
        }

        // ========== 启动 ==========
        function initApp() {
            const splash = document.getElementById('splashScreen');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            let progress = 0, splashDismissed = false;
            const progressTimer = setInterval(() => {
                if (splashDismissed) { clearInterval(progressTimer); return; }
                progress += Math.random() * 8 + 2;
                if (progress >= 100) {
                    progress = 100; progressFill.style.width = '100%';
                    progressText.textContent = '加载完成，点击进入'; clearInterval(progressTimer);
                } else {
                    progressFill.style.width = progress + '%';
                }
            }, 120);
            fetchDataFastest().then(() => {
                if (progress >= 90 && !splashDismissed) {
                    progress = 100; progressFill.style.width = '100%';
                    progressText.textContent = '加载完成，点击进入'; clearInterval(progressTimer);
                }
            });
            splash.addEventListener('click', () => {
                if (splashDismissed) return;
                splashDismissed = true; clearInterval(progressTimer);
                progressFill.style.width = '100%'; progressText.textContent = '加载完成，点击进入';
                setTimeout(() => {
                    splash.classList.add('hidden');
                    setTimeout(() => { splash.style.display = 'none'; }, 500);
                    // 启动自动刷新(每10秒)
                    setInterval(() => { if (!isRequesting) fetchDataFastest(); }, 10000);
                }, 300);
            });

            // 算法切换
            document.querySelectorAll('.algo-btn').forEach(btn => {
                btn.addEventListener('click', () => switchAlgo(btn.dataset.algo));
            });
            // 主题
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            // 复制
            document.getElementById('copyBtn').addEventListener('click', () => {
                const val = document.getElementById('recordText').value.trim();
                if (!val) return;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(val).then(() => {
                        document.getElementById('toast').classList.add('show');
                        setTimeout(() => document.getElementById('toast').classList.remove('show'), 2000);
                    }).catch(() => fallbackCopy(val));
                } else fallbackCopy(val);
            });
            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); document.getElementById('toast').classList.add('show'); setTimeout(() => document.getElementById('toast').classList.remove('show'), 2000); } catch(e) {}
                document.body.removeChild(ta);
            }
            // 手动刷新
            document.getElementById('refreshBtn').addEventListener('click', refreshData);
            // 历史
            document.getElementById('historyTriggerTop').addEventListener('click', openHistory);
            document.getElementById('historyTriggerBottom').addEventListener('click', openHistory);
            document.getElementById('historyClose').addEventListener('click', closeHistory);
            document.getElementById('historyOverlay').addEventListener('click', closeHistory);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
