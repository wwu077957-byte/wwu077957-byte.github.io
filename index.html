<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>杀组预测 · 统计看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06060b;
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image: radial-gradient(circle at 20% 30%, #14142a 0%, #06060b 70%);
        }
        #app {
            max-width: 480px;
            width: 100%;
            background: rgba(18, 18, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 28px 22px 32px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a2a;
        }
        .status-bar .live {
            color: #4cd964;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .status-bar .live::before {
            content: "●";
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .status-bar .time {
            color: #555;
            font-variant-numeric: tabular-nums;
        }
        .badge {
            background: #2a2a3e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #aaa;
            font-weight: 500;
        }
        .header {
            text-align: center;
            padding: 6px 0 18px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f6b83d, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .sub {
            font-size: 13px;
            color: #555;
            letter-spacing: 4px;
            margin-top: 2px;
        }
        .card-latest {
            background: rgba(255,255,255,0.03);
            border-radius: 28px;
            padding: 20px 20px 16px;
            margin-bottom: 22px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        .card-latest .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-latest .period {
            font-size: 14px;
            color: #888;
            font-weight: 500;
        }
        .card-latest .period span {
            color: #ccc;
        }
        .card-latest .combo-badge {
            background: rgba(74, 217, 100, 0.15);
            color: #4cd964;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        .card-latest .nums {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            margin: 6px 0 2px;
        }
        .card-latest .nums .sep {
            color: #444;
            margin: 0 4px;
        }
        .card-latest .sum {
            font-size: 15px;
            color: #888;
        }
        .card-latest .sum b { color: #ddd; font-weight: 500; }

        .card-kill {
            background: linear-gradient(145deg, rgba(255,59,48,0.08), rgba(255,59,48,0.02));
            border-radius: 32px;
            padding: 24px 16px 22px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,59,48,0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-kill::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255,59,48,0.05), transparent 70%);
            animation: glow 4s ease-in-out infinite alternate;
        }
        @keyframes glow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        .card-kill .label {
            font-size: 13px;
            color: #888;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        .card-kill .kill {
            font-size: 44px;
            font-weight: 800;
            color: #ff3b30;
            line-height: 1.2;
            margin-top: 4px;
            text-shadow: 0 0 40px rgba(255,59,48,0.25);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }
        .card-kill .sub-info {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .card-kill .sub-info span {
            color: #aaa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .stat-item {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        .stat-item .num.gold { color: #f6b83d; }
        .stat-item .num.green { color: #4cd964; }
        .stat-item .num.red { color: #ff3b30; }
        .stat-item .num.purple { color: #bf7aff; }
        .stat-item .lbl {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .stat-item .result-badge {
            font-size: 22px;
            line-height: 1.4;
        }

        /* 历史结果行 */
        .card-history {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 14px 16px 12px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 14px;
        }
        .card-history .title {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .card-history .title .counts {
            font-weight: 500;
        }
        .card-history .title .counts .win { color: #4cd964; }
        .card-history .title .counts .lose { color: #ff3b30; }
        .history-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-start;
        }
        .history-dots .dot {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .history-dots .dot.win {
            background: rgba(76, 217, 100, 0.2);
            border-color: #4cd964;
            color: #4cd964;
        }
        .history-dots .dot.lose {
            background: rgba(255, 59, 48, 0.2);
            border-color: #ff3b30;
            color: #ff3b30;
        }

        .card-trend {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 14px 16px 12px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 14px;
        }
        .card-trend .row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .card-trend .row:last-child { border-bottom: none; }
        .card-trend .label { color: #666; }
        .card-trend .value {
            font-weight: 500;
            letter-spacing: 2px;
            color: #ccc;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .btn-refresh {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #aaa;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(10px);
        }
        .btn-refresh:active {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        @media (max-width: 420px) {
            #app { padding: 20px 16px 24px; border-radius: 32px; }
            .card-kill .kill { font-size: 36px; }
            .card-latest .nums { font-size: 26px; }
            .stats-grid { gap: 6px; }
            .stat-item .num { font-size: 18px; }
            .history-dots .dot { width: 24px; height: 24px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="status-bar">
        <span class="live">实时监控</span>
        <span class="badge">杀组预测</span>
        <span class="time" id="updateTime">--:--:--</span>
    </div>

    <div class="header">
        <h1>🔥 杀组预测</h1>
        <div class="sub">跨期 · 实时</div>
    </div>

    <div class="card-latest">
        <div class="top">
            <span class="period">📡 期号 <span id="period">--</span></span>
            <span class="combo-badge" id="comboBadge">--</span>
        </div>
        <div class="nums">
            <span id="a">--</span><span class="sep">+</span>
            <span id="b">--</span><span class="sep">+</span>
            <span id="c">--</span>
        </div>
        <div class="sum">和值 <b id="sum">--</b></div>
    </div>

    <div class="card-kill">
        <div class="label">🔮 下一期预测</div>
        <div class="kill" id="kill">-- 杀 --</div>
        <div class="sub-info">基于上期 <span id="basedOn">--</span></div>
    </div>

    <!-- 统计网格(含杀错) -->
    <div class="stats-grid">
        <div class="stat-item">
            <div class="num gold" id="total">0</div>
            <div class="lbl">总期数</div>
        </div>
        <div class="stat-item">
            <div class="num green" id="hit">0</div>
            <div class="lbl">🀄️ 杀对</div>
        </div>
        <div class="stat-item">
            <div class="num red" id="miss">0</div>
            <div class="lbl">🍉 杀错</div>
        </div>
        <div class="stat-item">
            <div class="num" id="rate">0%</div>
            <div class="lbl">命中率</div>
        </div>
        <div class="stat-item">
            <div class="num purple" id="curWin">0</div>
            <div class="lbl">当前连对</div>
        </div>
        <div class="stat-item">
            <div class="num" id="maxWin" style="color:#f6b83d;">0</div>
            <div class="lbl">最高连对</div>
        </div>
    </div>

    <!-- 历史结果序列 -->
    <div class="card-history">
        <div class="title">
            <span>📋 最近结果</span>
            <span class="counts">
                <span class="win">🀄️ <span id="winCount">0</span></span>
                <span style="margin:0 6px;color:#555;">|</span>
                <span class="lose">🍉 <span id="loseCount">0</span></span>
            </span>
        </div>
        <div class="history-dots" id="historyDots">
            <!-- 动态生成 -->
        </div>
    </div>

    <div class="card-trend">
        <div class="row">
            <span class="label">📈 大小 (近5期)</span>
            <span class="value" id="sizeTrend">--</span>
        </div>
        <div class="row">
            <span class="label">📈 单双 (近5期)</span>
            <span class="value" id="parityTrend">--</span>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn-refresh" id="refreshBtn">⟳ 刷新数据</button>
    </div>
</div>

<script>
// ========== 核心算法(换球) ==========
const KILL_MAP = {
    0:"小双",1:"小单",2:"小双",3:"小单",4:"小双",5:"小单",
    6:"小双",7:"小单",8:"小双",9:"小单",10:"小双",11:"小单",
    12:"小双",13:"小单",14:"大双",15:"大单",16:"大双",17:"大单",
    18:"大双",19:"大单",20:"大双",21:"大单",22:"大双",23:"大单",
    24:"大双",25:"大单",26:"大双",27:"大单"
};

function getKill(c1, c2) {
    const val = (Math.sin(c1) * Math.sqrt(c2)) / 3.0;
    const absVal = Math.abs(val);
    const s = absVal.toFixed(10);
    const frac = s.split('.')[1];
    const digits = (frac + '000').slice(0, 3);
    const n = parseInt(digits[0]) + parseInt(digits[1]) + parseInt(digits[2]);
    return KILL_MAP[n] || "小双";
}

// ========== 数据获取 ==========
const API_URL = "https://pc28.help/api/kj.json?nbr=5";

async function fetchData() {
    try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error('网络错误');
        const json = await resp.json();
        if (!json.data || json.data.length === 0) throw new Error('无数据');
        const items = json.data.map(item => {
            const nums = item.number.split('+').map(Number);
            const s = nums.reduce((a,b) => a+b, 0);
            const combo = (s >= 14 ? '大' : '小') + (s % 2 ? '单' : '双');
            return {
                period: String(item.nbr),
                a: nums[0], b: nums[1], c: nums[2],
                sum: s,
                combo: combo
            };
        });
        items.sort((a,b) => parseInt(a.period) - parseInt(b.period));
        return items;
    } catch (e) {
        console.error(e);
        return null;
    }
}

// ========== 状态 ==========
let history = [];
let resultsHistory = [];        // 存储 '🀄️' 或 '🍉'
let pendingPeriod = null;
let pendingKill = null;
let total = 0, hit = 0, miss = 0;
let curWin = 0, maxWin = 0;
let lastBroadcastPeriod = null;

// ========== UI 引用 ==========
const $ = id => document.getElementById(id);

function updateUI(latest) {
    // 开奖
    if (latest) {
        $('period').textContent = latest.period;
        $('a').textContent = latest.a;
        $('b').textContent = latest.b;
        $('c').textContent = latest.c;
        $('sum').textContent = latest.sum;
        $('comboBadge').textContent = latest.combo;
    }

    // 杀号
    if (pendingPeriod && pendingKill) {
        const shortPeriod = pendingPeriod.slice(-2);
        $('kill').textContent = `${shortPeriod} 杀 ${pendingKill}`;
    } else {
        $('kill').textContent = '-- 杀 --';
    }

    if (history.length >= 2) {
        const prev = history[history.length - 2];
        $('basedOn').textContent = `C = ${prev.c}`;
    } else {
        $('basedOn').textContent = '等待数据...';
    }

    // 统计
    const rate = total ? (hit / total * 100) : 0;
    $('total').textContent = total;
    $('hit').textContent = hit;
    $('miss').textContent = miss;
    $('rate').textContent = rate.toFixed(1) + '%';
    $('curWin').textContent = curWin;
    $('maxWin').textContent = maxWin;

    // 历史结果计数
    const winCnt = resultsHistory.filter(r => r === '🀄️').length;
    const loseCnt = resultsHistory.filter(r => r === '🍉').length;
    $('winCount').textContent = winCnt;
    $('loseCount').textContent = loseCnt;

    // 历史结果点阵(最近15期)
    const dotsContainer = $('historyDots');
    const recent = resultsHistory.slice(-15);
    dotsContainer.innerHTML = recent.map(r => {
        const cls = r === '🀄️' ? 'win' : 'lose';
        return `<div class="dot ${cls}">${r}</div>`;
    }).join('');
    if (recent.length === 0) {
        dotsContainer.innerHTML = '<span style="color:#555;font-size:13px;">暂无结果</span>';
    }

    // 走势
    if (history.length >= 5) {
        const recent5 = history.slice(-5);
        const size = recent5.map(h => h.sum >= 14 ? '大' : '小').join(' ');
        const parity = recent5.map(h => h.sum % 2 ? '单' : '双').join(' ');
        $('sizeTrend').textContent = size;
        $('parityTrend').textContent = parity;
    } else {
        $('sizeTrend').textContent = '--';
        $('parityTrend').textContent = '--';
    }

    $('updateTime').textContent = new Date().toLocaleTimeString();
}

// ========== 核心更新 ==========
async function refreshData() {
    const data = await fetchData();
    if (!data || data.length < 3) return;

    const existing = new Set(history.map(h => h.period));
    for (const d of data) {
        if (!existing.has(d.period)) {
            history.push(d);
            existing.add(d.period);
        }
    }
    history.sort((a,b) => parseInt(a.period) - parseInt(b.period));
    if (history.length < 3) return;

    const latest = history[history.length - 1];
    const current = latest.period;

    // 验证上期
    if (pendingPeriod && pendingPeriod === current) {
        const ok = pendingKill !== latest.combo;
        total += 1;
        if (ok) {
            hit += 1;
            curWin += 1;
            if (curWin > maxWin) maxWin = curWin;
            resultsHistory.push('🀄️');
        } else {
            miss += 1;
            curWin = 0;
            resultsHistory.push('🍉');
        }
        // 控制历史长度
        if (resultsHistory.length > 50) resultsHistory = resultsHistory.slice(-50);
        pendingPeriod = null;
    }

    // 新预测
    if (current !== lastBroadcastPeriod) {
        const prev = history[history.length - 2];
        const prev2 = history[history.length - 3];
        const c1 = prev.c;
        const c2 = prev2.c;
        const kill = getKill(c1, c2);
        const nextPeriod = String(parseInt(current) + 1);
        pendingPeriod = nextPeriod;
        pendingKill = kill;
        lastBroadcastPeriod = current;
    }

    updateUI(latest);
}

// ========== 启动 ==========
let timer = null;
function start() {
    if (timer) clearInterval(timer);
    refreshData();
    timer = setInterval(refreshData, 3000);
}

document.getElementById('refreshBtn').addEventListener('click', () => {
    refreshData();
});

document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshData();
});

start();
console.log('🔥 杀组预测看板已启动');
</script>
</body>
</html>
